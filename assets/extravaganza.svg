    <path d="M86.5 91H113.5" stroke="#FF8B79" stroke-opacity="0.76" stroke-width="1.8"/>
    <circle cx="100" cy="88" r="10.2" fill="#291720" stroke="#FFF5DB" stroke-width="2"/>
    <circle cx="100" cy="88" r="4.1" fill="#FFD46E"/>
