<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Extravaganza logo</title>
  <desc id="desc">A theatrical hexagonal emblem with a spotlighted stage, marquee rails, and a bright proving-ground core.</desc>
  <defs>
    <linearGradient id="exShell" x1="32" y1="24" x2="168" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD46E"/>
      <stop offset="0.46" stop-color="#FF7A72"/>
      <stop offset="1" stop-color="#FF4FC3"/>
    </linearGradient>
    <linearGradient id="exTrace" x1="56" y1="46" x2="144" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6DB"/>
      <stop offset="1" stop-color="#FFD8F2"/>
    </linearGradient>
    <radialGradient id="exAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(100 98) rotate(90) scale(74)">
      <stop offset="0" stop-color="#FFBA95" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFBA95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="exSpotlight" x1="100" y1="42" x2="100" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF5D8" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFBF8A" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="exShadow" x="14" y="12" width="172" height="178" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#160C14" flood-opacity="0.26"/>
    </filter>
    <filter id="exBloom" x="40" y="36" width="120" height="126" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.4" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="screen"/>
    </filter>
  </defs>

